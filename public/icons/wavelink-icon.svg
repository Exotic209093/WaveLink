<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284a8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f7ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Subtle inner shadow -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- Wave path — 3 flowing data streams -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top wave -->
    <path d="M24 46 C36 34, 48 34, 56 46 S76 58, 88 46 S100 34, 104 40" stroke-width="6" opacity="0.6"/>
    <!-- Middle wave (main, thicker) -->
    <path d="M24 64 C36 48, 48 48, 56 64 S76 80, 88 64 S100 48, 104 56" stroke-width="8"/>
    <!-- Bottom wave -->
    <path d="M24 82 C36 70, 48 70, 56 82 S76 94, 88 82 S100 70, 104 76" stroke-width="6" opacity="0.6"/>
  </g>
  <!-- Link dots — data connection points -->
  <circle cx="24" cy="64" r="5" fill="white" opacity="0.9"/>
  <circle cx="104" cy="56" r="5" fill="white" opacity="0.9"/>
  <!-- Small SF cloud hint at top-right -->
  <path d="M90 28 C90 22, 96 18, 102 20 C104 16, 112 16, 114 22 C118 22, 120 26, 118 30 L90 30 Z" fill="white" opacity="0.25"/>
</svg>
