name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Treat warnings as failures so the codebase stays at zero lint findings.
        run: npm run lint -- --max-warnings=0

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Development dependency audit
        run: npm run audit:dev

      - name: Test with coverage gates
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build

      - name: Validate packaged extension
        run: npm run smoke:package
